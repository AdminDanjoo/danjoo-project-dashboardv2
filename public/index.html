function openPhaseBarStatusEditor(barEl, idx, phaseIdx){
  const row = rows[idx];
  const phase = row.phases[phaseIdx];
  barEl.innerHTML = `<select class="gantt-status-select">${phaseStatusOptions().map(s=>`<option value="${s}" ${s===phase.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>`;
  const sel = barEl.querySelector('select');
  sel.focus();
  editingField = true;
  let committed = false;
  function commit(v){
    committed = true;
    phase.status = v;
    if(v==='In Progress'){ row.stage = phase.name; row.modified = todayStr(); }
    persistProject(idx, {phases: row.phases, stage: row.stage});
    notify(row, `<b>${row.client}</b> — ${phase.name} set to ${v}.`);
    render();
  }
  sel.addEventListener('change', ()=>commit(sel.value));
  sel.addEventListener('blur', ()=>{ if(!committed) render(); });
}

document.getElementById('ganttCard').addEventListener('mousedown', function(e){
  const bar = e.target.closest('.gantt-drag-bar, .gantt-status-only, .gantt-task-bar');
  if(!bar || bar.querySelector('select')) return;
  e.preventDefault();

  const isTask = bar.classList.contains('gantt-task-bar');
  const isPhase = bar.classList.contains('gantt-phase-bar');
  const idx = bar.dataset.idx;
  const taskIdx = bar.dataset.taskIdx;
  const phaseIdx = bar.dataset.phaseIdx;
  const startField = bar.dataset.startField;
  const endField = bar.dataset.endField;
  const canDrag = bar.classList.contains('gantt-drag-bar') && startField && endField;

  const rect = bar.getBoundingClientRect();
  const edgeZone = 8;
  let mode = 'move';
  if(canDrag){
    const offsetInBar = e.clientX - rect.left;
    if(offsetInBar <= edgeZone) mode = 'resize-left';
    else if(offsetInBar >= rect.width - edgeZone) mode = 'resize-right';
  }

  const startX = e.clientX;
  const origLeft = parseFloat(bar.style.left) || 0;
  const origWidth = parseFloat(bar.style.width) || 0;
  let dragged = false;
  document.body.style.userSelect = 'none';

  const target = isTask ? tasks[taskIdx] : (isPhase ? rows[idx].phases[phaseIdx] : rows[idx]);
  const origStartVal = canDrag ? target[startField] : null;
  const origEndVal = canDrag ? target[endField] : null;
  const daysPerPx = 7/WEEK_WIDTH;

  function onMove(ev){
    if(!canDrag) return;
    const dx = ev.clientX - startX;
    if(Math.abs(dx) > 3) dragged = true;
    if(!dragged) return;
    let newLeft = origLeft, newWidth = origWidth;
    if(mode==='move') newLeft = origLeft + dx;
    else if(mode==='resize-left'){ newLeft = origLeft + dx; newWidth = origWidth - dx; }
    else if(mode==='resize-right'){ newWidth = origWidth + dx; }
    if(newWidth < 10){ if(mode==='resize-left') newLeft = origLeft + origWidth - 10; newWidth = 10; }
    bar.style.left = newLeft + 'px';
    bar.style.width = newWidth + 'px';
    /* Live date readout inside the bar — updates as it moves, before anything is committed. */
    const dateSpan = bar.querySelector('.bar-date-text');
    if(dateSpan){
      let previewStart = origStartVal, previewEnd = origEndVal;
      if(mode==='move'){
        const deltaDays = Math.round((newLeft-origLeft)*daysPerPx);
        previewStart = addDays(origStartVal, deltaDays); previewEnd = addDays(origEndVal, deltaDays);
      } else if(mode==='resize-left'){
        const deltaDays = Math.round((newLeft-origLeft)*daysPerPx);
        previewStart = addDays(origStartVal, deltaDays);
      } else if(mode==='resize-right'){
        const deltaDays = Math.round((newWidth-origWidth)*daysPerPx);
        previewEnd = addDays(origEndVal, deltaDays);
      }
      dateSpan.textContent = `${fmt(previewStart)} → ${fmt(previewEnd)}`;
    }
  }

  function onUp(){
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.body.style.userSelect = '';
    if(!dragged){
      if(isTask) openTaskBarStatusEditor(bar, taskIdx);
      else if(isPhase) openPhaseBarStatusEditor(bar, idx, phaseIdx);
      else openBarStatusEditor(bar, idx);
      return;
    }
    const finalLeft = parseFloat(bar.style.left);
    const finalWidth = parseFloat(bar.style.width);
    if(mode==='move'){
      const deltaDays = Math.round((finalLeft-origLeft)*daysPerPx);
      if(deltaDays!==0){ target[startField] = addDays(target[startField], deltaDays); target[endField] = addDays(target[endField], deltaDays); }
    } else if(mode==='resize-left'){
      const deltaDays = Math.round((finalLeft-origLeft)*daysPerPx);
      if(deltaDays!==0) target[startField] = addDays(target[startField], deltaDays);
    } else if(mode==='resize-right'){
      const deltaDays = Math.round((finalWidth-origWidth)*daysPerPx);
      if(deltaDays!==0) target[endField] = addDays(target[endField], deltaDays);
    }
    if(isTask){
      persistTask(taskIdx, {[startField]: target[startField], [endField]: target[endField]});
      notify(target, `<b>${target.owner}</b>: ${target.task} on <b>${target.client}</b> — schedule updated.`);
    } else if(isPhase){
      const row = rows[idx];
      persistProject(idx, {phases: row.phases});
      notify(row, `<b>${row.client}</b> — ${target.name} dates updated (${fmt(target.start)} → ${fmt(target.end)}).`);
    } else {
      target.modified = todayStr();
      persistProject(idx, {[startField]: target[startField], [endField]: target[endField], modified: target.modified});
      notify(target, `<b>${target.client}</b> — schedule updated. Also reflected in All Projects.`);
    }
    render();
  }

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
});

/* Refresh centrally stored changes made by other users. Never refresh over an active edit or while
   this tab is still saving, so a local change cannot be wiped mid-edit. */
function backgroundSyncTick(){
  loadRemoteState();
}
window.setInterval(backgroundSyncTick, 15000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') loadRemoteState();
});

render();
loadRemoteState({initial:true});
</script>
