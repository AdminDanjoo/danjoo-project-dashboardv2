<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Danjoo Project Dashboard — Concept</title>
<style>
  :root{
    --sp-blue:#0078D4;
    --sp-blue-dark:#106EBE;
    --bg:#FAF9F8;
    --card:#FFFFFF;
    --border:#EDEBE9;
    --text:#201F1E;
    --text-muted:#605E5C;
    --green-bg:#DFF6DD; --green-text:#0B6A0B;
    --amber-bg:#FFF4CE; --amber-text:#8A6D00;
    --red-bg:#FDE7E9; --red-text:#A80000;
    --grey-bg:#F3F2F1; --grey-text:#605E5C;
    --blue-bg:#DEECF9; --blue-text:#004578;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    font-size:14px;
  }
  .app{max-width:1180px; margin:0 auto; padding:24px 20px 60px;}
  .top{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
  h1{font-size:19px; font-weight:600; margin:0; letter-spacing:-.01em;}
  .sub{color:var(--text-muted); font-size:12.5px;}
  .note{color:var(--text-muted); font-size:12.5px; margin:2px 0 10px;}
  .note b{color:var(--text);}
  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); margin:16px 0; flex-wrap:wrap;}
  .tab{
    padding:10px 16px; font-size:13.5px; font-weight:600; color:var(--text-muted);
    cursor:pointer; border-bottom:2px solid transparent; user-select:none; white-space:nowrap;
  }
  .tab:hover{color:var(--text);}
  .tab.active{color:var(--sp-blue); border-bottom-color:var(--sp-blue);}
  .tab .count{
    display:inline-block; margin-left:6px; background:var(--grey-bg); color:var(--text-muted);
    border-radius:10px; padding:1px 7px; font-size:11px; font-weight:600;
  }
  .tab.active .count{background:var(--blue-bg); color:var(--sp-blue);}
  .view-desc{color:var(--text-muted); font-size:12.5px; margin:-6px 0 14px;}
  .hint{color:var(--sp-blue-dark); font-weight:600;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:4px; overflow-x:auto; overflow-y:hidden; box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  table{width:100%; border-collapse:collapse;}
  #tableCard table{table-layout:fixed; min-width:1150px;}
  thead th{
    text-align:left; font-size:12px; font-weight:600; color:var(--text-muted);
    padding:9px 12px; border-bottom:1px solid var(--border); background:#FBFBFB; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;
  }
  thead th.sortable-th{cursor:pointer; user-select:none;}
  thead th.sortable-th:hover{color:var(--text); background:#F3F2F1;}
  thead th.active-sort{color:var(--sp-blue);}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top; font-size:13px;}
  tbody tr:hover{background:#F3F9FD;}
  tbody tr.group-row td{
    background:#F3F2F1; font-weight:600; font-size:12px; color:var(--text-muted);
    text-transform:uppercase; letter-spacing:.03em; padding:8px 12px;
  }
  .client{font-weight:600;}
  .addr{color:var(--text-muted); font-size:12px; margin-top:1px;}
  .pill{display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; font-weight:600; white-space:nowrap;}
  .pill.inprogress{background:var(--blue-bg); color:var(--blue-text);}
  .pill.completed{background:var(--green-bg); color:var(--green-text);}
  .pill.standby{background:var(--grey-bg); color:var(--grey-text);}
  .pill.pending{background:var(--amber-bg); color:var(--amber-text);}
  .pill.priority{background:var(--red-bg); color:var(--red-text);}
  .pill.small{font-size:11px; padding:1px 7px;}
  .bar-wrap{display:flex; align-items:center; gap:6px;}
  .bar{width:60px; height:6px; border-radius:3px; background:var(--grey-bg); overflow:hidden;}
  .bar > div{height:100%; background:var(--sp-blue);}
  .muted{color:var(--text-muted);}
  .stale{color:var(--red-text); font-weight:600;}
  .comment{color:var(--text-muted); font-size:12.5px; max-width:260px;}
  .foot{margin-top:22px; padding:14px 16px; background:#F3F9FD; border:1px solid #D0E7F8; border-radius:4px; font-size:12.5px; color:var(--text-muted);}
  .foot b{color:var(--text);}

  .editable-pct{cursor:pointer; padding:3px 5px; margin:-3px -5px; border-radius:4px; border:1px dashed transparent;}
  .editable-pct:hover{background:#FFF9E8; border-color:#F3C948;}
  .pct-val{font-weight:600;}
  .pct-input{width:48px; font-size:13px; padding:2px 4px; border:1px solid var(--sp-blue); border-radius:3px; outline:none;}
  .editable-stage{cursor:pointer; padding:3px 6px; margin:-3px -6px; border-radius:4px; border:1px dashed transparent; display:inline-block;}
  .editable-stage:hover{background:#FFF9E8; border-color:#F3C948;}
  .stage-input{font-size:13px; padding:3px 5px; border:1px solid var(--sp-blue); border-radius:3px; outline:none; font-family:inherit;}
  .editable-status{cursor:pointer; padding:3px 6px; margin:-3px -6px; border-radius:4px; border:1px dashed transparent; display:inline-block;}
  .editable-status:hover{background:#FFF9E8; border-color:#F3C948;}
  .auto-pct{cursor:default;}
  .workload-chart-wrap{padding:6px 0;}

  .editable-date{cursor:pointer; padding:2px 4px; margin:-2px -4px; border-radius:4px; border:1px dashed transparent;}
  .editable-date:hover{background:#FFF9E8; border-color:#F3C948;}
  .date-input{font-size:12px; padding:2px 4px; border:1px solid var(--sp-blue); border-radius:3px; outline:none; font-family:inherit;}
  .editable-comment{cursor:pointer; padding:2px 4px; margin:-2px -4px; border-radius:4px; border:1px dashed transparent; display:block; min-height:16px;}
  .editable-text{cursor:pointer; padding:2px 4px; margin:-2px -4px; border-radius:4px; border:1px dashed transparent; display:inline-block; max-width:100%;}
  .editable-text:hover{background:#FFF9E8; border-color:#F3C948;}
  .text-input{font-size:13px; padding:2px 4px; border:1px solid var(--sp-blue); border-radius:3px; outline:none; font-family:inherit; width:100%; box-sizing:border-box;}
  .editable-type{cursor:pointer; padding:3px 6px; margin:-3px -6px; border-radius:4px; border:1px dashed transparent; display:inline-block;}
  .editable-type:hover{background:#FFF9E8; border-color:#F3C948;}
  .editable-what{cursor:pointer; padding:2px 4px; margin:-2px -4px; border-radius:4px; border:1px dashed transparent; display:inline-block; max-width:100%;}
  .editable-what:hover{background:#FFF9E8; border-color:#F3C948;}
  .editable-comment:hover{background:#FFF9E8; border-color:#F3C948;}
  .comment-input{width:100%; font-size:12.5px; padding:5px 7px; border:1px solid var(--sp-blue); border-radius:3px; outline:none; font-family:inherit; resize:vertical; min-height:46px;}

  .seg-toggle{display:inline-flex; border:1px solid #C8C6C4; border-radius:4px; overflow:hidden;}
  .seg-btn{background:#fff; border:none; padding:7px 14px; font-size:13px; font-weight:600; color:var(--text-muted); cursor:pointer; border-right:1px solid #C8C6C4;}
  .seg-btn:last-child{border-right:none;}
  .seg-btn:hover{background:var(--grey-bg);}
  .seg-btn.active{background:var(--sp-blue); color:#fff;}

  .toolbar{margin-bottom:10px; min-height:32px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;}
  .toolbar-left{display:flex; gap:8px;}
  .toolbar-right{display:flex; gap:8px;}
  .filter-sort-group{display:flex; gap:8px;}
  .dropdown{position:relative;}
  .dropdown-panel{position:absolute; top:38px; left:0; background:#fff; border:1px solid #C8C6C4; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,0.14); padding:10px 12px; min-width:210px; z-index:40;}
  .dd-label{font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em; margin:2px 0 4px;}
  .dropdown-divider{border-top:1px solid var(--border); margin:8px 0;}
  .filter-row{display:flex; align-items:center; gap:7px; padding:4px 2px; font-size:13px; cursor:pointer; white-space:nowrap;}
  .filter-row input{cursor:pointer;}
  .owner-manage-row{display:flex; align-items:center; gap:4px;}
  .owner-remove-btn{background:none; border:none; color:var(--text-muted); font-size:16px; line-height:1; cursor:pointer; padding:2px 7px; border-radius:3px;}
  .owner-remove-btn:hover{background:var(--red-bg); color:var(--red-text);}
  .owner-add-row{display:flex; gap:6px; margin-top:8px;}
  .owner-add-input{flex:1; font-size:13px; padding:5px 7px; border:1px solid #C8C6C4; border-radius:4px; font-family:inherit; min-width:0;}
  .owner-new-input{width:130px;}
  .btn-primary{background:var(--sp-blue); color:#fff; border:none; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-primary:hover{background:var(--sp-blue-dark);}
  .btn-secondary{background:#fff; color:var(--text); border:1px solid #C8C6C4; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer; margin-left:6px;}
  .btn-secondary:hover{background:var(--grey-bg);}
  .btn-danger{background:var(--red-text); color:#fff; border:none; padding:7px 14px; border-radius:4px; font-size:13px; font-weight:600; cursor:pointer;}
  .btn-danger:hover{background:#800000;}

  .modal-overlay{
    position:fixed; inset:0; background:rgba(32,31,30,0.45); display:flex; align-items:center; justify-content:center;
    z-index:200; padding:16px; overflow-y:auto;
  }
  .modal-box{background:var(--card); border-radius:6px; padding:20px 22px; max-width:400px; width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.28); margin:auto;}
  .modal-box h3{margin:0 0 8px; font-size:15px; font-weight:600; color:var(--text);}
  .modal-box p{margin:0 0 18px; font-size:13px; color:var(--text-muted); line-height:1.5;}
  .modal-box p b{color:var(--text);}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px;}
  tr.new-row td{background:#F3F9FD;}
  .new-row-form{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:4px 0;}
  .new-row-form input, .new-row-form select{font-size:13px; padding:6px 8px; border:1px solid #C8C6C4; border-radius:4px; font-family:inherit;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#212121; color:#fff; padding:9px 16px; border-radius:6px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; z-index:50;
    box-shadow:0 4px 14px rgba(0,0,0,0.25); max-width:480px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast b{color:#7EC7FF;}

  /* Gantt */
  .gantt-card{background:var(--card); border:1px solid var(--border); border-radius:4px; overflow:hidden;}
  .gantt-legend{display:flex; gap:14px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--border); font-size:11.5px; color:var(--text-muted);}
  .legend-item{display:flex; align-items:center; gap:5px;}
  .swatch{width:14px; height:9px; border-radius:2px; display:inline-block;}
  .gantt-scroll{overflow-x:auto; overflow-y:hidden;}
  .gantt-scroll-content{position:relative;}
  .gantt-row{display:flex; border-bottom:1px solid #DDDBD9;}
  .gantt-row:last-child{border-bottom:none;}
  .gantt-row.month-row{height:20px;}
  .gantt-row.week-header-row{height:22px;}
  .gantt-row.header-row{background:#FBFBFB;}
  .gantt-label{
    flex:0 0 var(--gantt-label-w, 220px); width:var(--gantt-label-w, 220px); position:sticky; left:114px; z-index:10; background:#fff;
    padding:0 12px; font-size:12.5px; border-right:1px solid var(--border); display:flex; flex-direction:column; justify-content:center;
  }
  .gantt-row.header-row .gantt-label{background:#FBFBFB;}
  .gantt-label .client{font-size:13px;}
  .gantt-label-title{font-weight:600; color:var(--text-muted);}
  .gantt-resize-handle{
    position:absolute; top:0; right:-3px; width:7px; height:100%; cursor:col-resize; z-index:13;
  }
  .gantt-resize-handle::after{content:''; position:absolute; top:0; bottom:0; left:3px; width:1px; background:transparent;}
  .gantt-resize-handle:hover::after, .gantt-resize-handle.dragging::after{background:var(--sp-blue);}
  .gantt-timeline{position:relative; flex:0 0 auto;}
  .gantt-row:not(.header-row) .gantt-timeline{
    background-image:repeating-linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px, transparent 46px);
  }
  .month-band{position:absolute; top:0; bottom:0; border-left:1px solid var(--border); font-size:11px; font-weight:600; color:var(--text-muted); padding:3px 0 0 6px; white-space:nowrap;}
  .week-col{position:absolute; top:0; bottom:0; border-left:1px solid var(--border); font-size:9.5px; color:var(--text-muted); text-align:left; padding:4px 0 0 4px;}
  .gantt-bar{
    position:absolute; border-radius:4px; overflow:hidden;
    display:flex; align-items:center; font-size:10.5px; color:#fff; font-weight:600; white-space:nowrap; z-index:2;
  }
  .seg-wait{background:repeating-linear-gradient(45deg,#F3C948,#F3C948 5px,#FBE49A 5px,#FBE49A 10px); color:#5C4A00;}
  .seg-active{background:var(--sp-blue);}
  .seg-completed{background:#5EA35E;}
  .seg-hold{background:repeating-linear-gradient(45deg,#C8C6C4,#C8C6C4 5px,#E1DFDD 5px,#E1DFDD 10px); color:#484644;}
  .seg-pending{background:#FFB900; color:#4A3B00;}
  .seg-overdue{background:#D13438; color:#fff;}
  .seg-label{padding:0 6px; overflow:hidden; text-overflow:ellipsis; flex:0 1 auto; min-width:0;}
  /* Compact view: whole project span in a light tint, current phase in full colour on top. */
  .gantt-bar.span-light{box-shadow:inset 0 0 0 999px rgba(255,255,255,.62); color:var(--text);}
  .gantt-bar.span-light .cur-phase-seg{position:absolute; top:0; bottom:0; border-radius:4px; box-shadow:none; pointer-events:none;}
  .gantt-bar.span-light .seg-label{position:relative; z-index:1; margin-left:3px; padding:1px 6px; border-radius:3px; background:rgba(255,255,255,.88); color:var(--text);}
  .today-line{position:absolute; top:0; bottom:0; width:0; border-left:2px dashed #D13438; z-index:5;}
  .today-tag{
    position:absolute; top:-1px; transform:translateX(-50%); background:#D13438; color:#fff;
    font-size:10px; font-weight:700; padding:1px 6px; border-radius:3px; white-space:nowrap; z-index:6;
  }
  .gantt-dates{font-size:10.5px; color:var(--text-muted); margin-top:1px;}
  .task-dates{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; display:inline-block;}
  .gantt-drag-bar{cursor:grab;}
  .gantt-drag-bar:active{cursor:grabbing;}
  .gantt-status-only, .gantt-task-bar{cursor:pointer;}
  .gantt-status-select{width:100%; height:100%; border:none; outline:none; font-size:10.5px; font-weight:600; padding:0 4px; background:#fff; color:var(--text); font-family:inherit;}

  .insight{background:#FFF9E8; border:1px solid #F3C948; border-radius:4px; padding:10px 14px; margin-bottom:10px; font-size:12.5px; color:#5C4A00;}
  .insight b{color:#3D3000;}

  .phase-toggle-btn, .action-expand-btn{background:none; border:1px solid #C8C6C4; border-radius:4px; width:22px; height:22px; line-height:1; font-size:12px; cursor:pointer; color:var(--text-muted); flex:0 0 auto;}
  .phase-toggle-btn:hover, .action-expand-btn:hover{background:var(--grey-bg); color:var(--text);}
  .action-expand-btn{margin-right:8px;}
  tr.phase-subrow td{background:#FBFBFB; padding:12px 16px 14px 40px; border-bottom:1px solid var(--border);}
  tr.phase-subrow td::before, tr.project-group-row td::before{content:none;}
  .phase-list{display:flex; flex-direction:column; gap:6px; margin-bottom:10px;}
  .phase-item{display:flex; align-items:center; gap:8px; font-size:12.5px;}
  .phase-item .phase-name{font-weight:600;}
  .editable-phase-status{cursor:pointer; padding:1px 2px; margin:-1px -2px; border-radius:4px; border:1px dashed transparent; display:inline-block;}
  .editable-phase-status:hover{background:#FFF9E8; border-color:#F3C948;}
  .editable-phase-date{cursor:pointer; padding:1px 3px; margin:-1px -3px; border-radius:4px; border:1px dashed transparent;}
  .editable-phase-date:hover{background:#FFF9E8; border-color:#F3C948;}
  .phase-remove-btn{margin-left:auto; background:none; border:none; color:var(--text-muted); font-size:15px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:3px;}
  .phase-remove-btn:hover{background:var(--red-bg); color:var(--red-text);}
  .phase-add-row{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .phase-add-row select, .phase-add-row input{font-size:12.5px; padding:5px 7px; border:1px solid #C8C6C4; border-radius:4px; font-family:inherit;}
  tr.project-group-row td{background:#F3F9FD; padding:8px 12px; border-bottom:1px solid var(--border); font-size:13px;}
  .edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 14px; margin-top:4px;}
  .edit-grid label{display:flex; flex-direction:column; gap:4px; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  .edit-grid input, .edit-grid select{font-size:13px; padding:7px 9px; border:1px solid #C8C6C4; border-radius:4px; font-family:inherit; color:var(--text); text-transform:none; font-weight:400; letter-spacing:normal;}
  .modal-box-lg{max-width:580px;}
  .history-label{margin-top:16px; font-size:11px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.03em;}
  .history-list{margin-top:6px; max-height:150px; overflow-y:auto; border:1px solid var(--border); border-radius:4px;}
  .history-item{display:flex; gap:10px; padding:6px 9px; font-size:12px; border-bottom:1px solid var(--border);}
  .history-item:last-child{border-bottom:none;}
  .history-ts{flex:0 0 auto; color:var(--text-muted); white-space:nowrap;}
  .history-text{color:var(--text);}
  .gantt-num{flex:0 0 30px; width:30px; position:sticky; left:0; z-index:11; background:#fff; font-size:11.5px; color:var(--text-muted); display:flex; align-items:center; justify-content:center; border-right:1px solid var(--border);}
  .gantt-row.header-row .gantt-num{background:#FBFBFB;}
  .gantt-jobtype{flex:0 0 84px; width:84px; position:sticky; left:30px; z-index:11; background:#fff; font-size:11px; color:var(--text-muted); display:flex; align-items:center; padding:0 8px; border-right:1px solid var(--border); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .gantt-row.header-row .gantt-jobtype{background:#FBFBFB;}
  .bar-date-text{font-weight:400; opacity:.9;}

  .mobile-sort{display:none; align-items:center; gap:6px;}
  .mobile-sort select{font-size:13px; padding:6px 8px; border:1px solid #C8C6C4; border-radius:4px; font-family:inherit; max-width:150px;}
  .mobile-sort .btn-secondary{margin-left:0; padding:7px 11px;}

  @media (max-width: 720px){
    .app{padding:14px 12px 44px;}
    .top{gap:8px;}
    h1{font-size:16.5px;}
    .sub{font-size:11.5px;}
    .tabs{gap:2px;}
    .tab{padding:8px 9px; font-size:12.5px;}
    .toolbar-left{flex-wrap:wrap; row-gap:8px;}
    .mobile-sort{display:flex;}
    .dropdown-panel{min-width:0; width:min(280px, 84vw);}
    .gantt-jobtype{flex:0 0 56px; width:56px; left:30px; font-size:9.5px; padding:0 5px;}
    .gantt-label{flex:0 0 128px; width:128px; padding:0 8px; left:86px;}
    .gantt-label .client{font-size:12.5px;}
    .task-dates{max-width:100px;}
    .edit-grid{grid-template-columns:1fr;}

    #tableCard table, #tableCard tbody, #tableCard tr{ display:block; width:100%; }
    #tableCard thead{ display:none; }
    #tableCard tbody tr:not(.group-row){ border-bottom:1px solid var(--border); }
    #tableCard tbody tr:hover{ background:none; }
    #tableCard tbody td{
      display:block; width:100%; padding:7px 12px; border-bottom:1px dashed var(--border);
      box-sizing:border-box;
    }
    #tableCard tbody tr:not(.group-row) td:last-child{ border-bottom:none; }
    #tableCard tbody tr.group-row td{ padding:8px 12px; }
    #tableCard tbody td::before{
      content: attr(data-label); display:block; font-size:10px; font-weight:700; color:var(--text-muted);
      text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;
    }
    #tableCard tbody tr.group-row td::before{ content:none; }
    .comment{ max-width:none; }
    .bar{ width:110px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>Danjoo Project Dashboard</h1><span class="sub">Live tracker — Projects, Actions &amp; Programme</span><span class="sub" id="syncStatus" style="margin-left:auto;"></span></div>

  <div class="tabs" id="tabs"></div>
  <div class="view-desc" id="viewDesc"></div>
  <div class="toolbar" id="toolbar"></div>

const DASHBOARD_API = '/api/dashboard';
let dbAvailable = false;
let syncState = 'connecting';
let pendingWrites = 0;
let writeQueue = Promise.resolve();

function updateSyncStatus(){
  const el = document.getElementById('syncStatus');
  if(!el) return;
  if(syncState==='saving'){
    el.innerHTML = '<span style="color:var(--amber-text);">●</span> Saving changes…';
  } else if(syncState==='error'){
    el.innerHTML = '<span style="color:#D13438;">●</span> Not saved — connection error';
  } else if(syncState==='live'){
    el.innerHTML = '<span style="color:#107C10;">●</span> Live — all changes saved';
  } else {
    el.innerHTML = '<span style="color:var(--amber-text);">●</span> Connecting…';
  }
}

async function apiRequest(body){
  const options = body ? {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body)
  } : {method:'GET', headers:{'Accept':'application/json'}};
  const response = await fetch(DASHBOARD_API, options);
  const data = await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.error || `Database request failed (${response.status})`);
  return data;
}

function persist(action, payload){
  pendingWrites += 1;
  syncState = 'saving';
  updateSyncStatus();
  writeQueue = writeQueue.catch(()=>{}).then(()=>apiRequest({action, ...payload})).then(()=>{
    pendingWrites -= 1;
    dbAvailable = true;
    syncState = pendingWrites ? 'saving' : 'live';
    updateSyncStatus();
  }).catch(error=>{
    pendingWrites = Math.max(0, pendingWrites-1);
    dbAvailable = false;
    syncState = 'error';
    updateSyncStatus();
    showToast(`Change not saved: <b>${error.message}</b>`);
    return {ok:false, error};
  });
  return writeQueue;
}
function persistProject(idx, patch){ return persist('patchProject', {idx:Number(idx), patch}); }
function persistNewProject(project){ return persist('upsertProject', {project}); }
function persistTask(idx, patch){ return persist('patchTask', {idx:Number(idx), patch}); }
function persistNewTask(task){ return persist('upsertTask', {task}); }
function persistOwners(){ return persist('setOwners', {owners:OWNERS}); }

function hydrateState(state){
  const remoteRows = [];
  (state.projects||[]).forEach(project=>{
    if(!Number.isSafeInteger(project.idx)) return;
    remoteRows[project.idx] = {...project, phases:(project.phases||[]).map(phase=>({...phase}))};
  });
  const remoteTasks = [];
  (state.tasks||[]).forEach(task=>{
    if(!Number.isSafeInteger(task.idx)) return;
    remoteTasks[task.idx] = {...task};
  });
  rows = remoteRows;
  tasks = remoteTasks;
  OWNERS = Array.isArray(state.owners) && state.owners.length ? [...state.owners] : SEED_OWNERS.slice();
  actionFilter.owners = new Set(OWNERS);
}

async function loadRemoteState({initial=false}={}){
  if(refreshInFlight || pendingWrites || editingField || addingNew || addingTaskFor!==null) return;
  refreshInFlight = true;
  if(initial){ syncState='connecting'; updateSyncStatus(); }
  try{
    let state = await apiRequest();
    if(!state.initialized){
      await apiRequest({action:'seed', projects:rows.filter(Boolean), tasks:tasks.filter(Boolean), owners:OWNERS});
      state = await apiRequest();
    }
    hydrateState(state);
    dbAvailable = true;
    syncState = 'live';
    render();
  } catch(error){
    dbAvailable = false;
    syncState = 'error';
    updateSyncStatus();
    if(initial) showToast(`Live database connection failed: <b>${error.message}</b>`);
  } finally {
    refreshInFlight = false;
  }
}

}

function addOwner(name){
  name = (name||'').trim();

  if(OWNERS.some(o=>o.toLowerCase()===name.toLowerCase())) return false;

  if(unassignedIdx>=0) OWNERS.splice(unassignedIdx,0,name); else OWNERS.push(name);

function projectActionItems(r){
  return tasks.filter(t=>!t.deleted && t.projectIdx===r.idx && (actionFilter.showDone || t.status!=='Completed') && actionFilter.owners.has(t.owner)).map(t=>({
    kind:'task', type:r.type, client:t.client, owner:t.owner, projRowIdx:r.idx,
    what: (t.whatOverride!=null && t.whatOverride!=='') ? t.whatOverride : `${t.task} — ${shortStage(t.phase)}`,
    status:t.status, pct:t.pct, comment:t.comment, taskIdx:t.idx

function actionsProjectIdxs(){
  /* Every live project belongs in Actions, even when it has no tasks yet.
     This keeps the project expandable so a first task can always be added. */
  return rows.filter(r=>!r.deleted).map(r=>r.idx);
}
function buildActions(){
  const groups = orderProjects(rows.filter(r=>!r.deleted));
  const out = [];
  let n = 1;
  for(const g of groups){
    if(g.group) out.push(`<tr class="group-row"><td colspan="9">${g.group} (${g.rows.length})</td></tr>`);
    g.rows.forEach(r=>{
      const items = projectActionItems(r);
      const totalItems = tasks.filter(t=>!t.deleted && t.projectIdx===r.idx).length;
      out.push(projectHeaderRowHtml(r, n++, items.length, totalItems));
      if(expandedActionsProject.has(r.idx)){
        out.push(...items.map(it=>actionRowHtml(it)));
        out.push(addingTaskFor===r.idx ? newTaskFormHtmlForProject(r) : addTaskTriggerRowHtml(r));
      }
    });
  }
  return out;
}

function wireFilterSortEvents(){
  const filterBtn = document.getElementById('filterBtn');
  if(filterBtn) filterBtn.addEventListener('click', (e)=>{ e.stopPropagation(); openDropdown = openDropdown==='filter' ? null : 'filter'; render(); });

  const mobileSortKey = document.getElementById('mobileSortKey');
  if(mobileSortKey) mobileSortKey.addEventListener('change', (e)=>{ e.stopPropagation(); overviewSort.col = mobileSortKey.value; render(); });
  const mobileSortDir = document.getElementById('mobileSortDir');
  if(mobileSortDir) mobileSortDir.addEventListener('click', (e)=>{ e.stopPropagation(); overviewSort.dir = overviewSort.dir==='asc' ? 'desc' : 'asc'; render(); });

  if(active==='overview'){
    document.querySelectorAll('.ov-type-cb').forEach(cb=>cb.addEventListener('change', (e)=>{ e.stopPropagation();
      if(cb.checked) overviewFilter.types.add(cb.value); else overviewFilter.types.delete(cb.value);
      render();
    }));
    document.querySelectorAll('.ov-status-cb').forEach(cb=>cb.addEventListener('change', (e)=>{ e.stopPropagation();
      if(cb.checked) overviewFilter.statuses.add(cb.value); else overviewFilter.statuses.delete(cb.value);
      render();
    }));
  }
  if(active==='actions'){
    document.querySelectorAll('.ac-owner-cb').forEach(cb=>cb.addEventListener('change', (e)=>{ e.stopPropagation();
      if(cb.checked) actionFilter.owners.add(cb.value); else actionFilter.owners.delete(cb.value);
      render();
    }));
    const showDoneCb = document.getElementById('ac-showdone-cb');
    if(showDoneCb) showDoneCb.addEventListener('change', (e)=>{ e.stopPropagation(); actionFilter.showDone = showDoneCb.checked; render(); });
    document.querySelectorAll('.owner-remove-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
      removeOwner(b.dataset.owner);
      render();
    }));
    const ownerAddBtn = document.getElementById('ownerAddBtn');
    const ownerAddInput = document.getElementById('ownerAddInput');
    if(ownerAddBtn) ownerAddBtn.addEventListener('click', (e)=>{ e.stopPropagation();
      const name = ownerAddInput.value.trim();

    });
    if(ownerAddInput) ownerAddInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); ownerAddBtn.click(); } });
  }
}

/* ---- Edit-row modal: change every field for a project in one place ---- */
const EDIT_FIELD_LABELS = {client:'Client', type:'Job Type', quote:'Quote #', job:'Job #', status:'Status', stage:'Current Stage', pct:'% Complete', priority:'Priority', start:'Start', end:'End', liftOrdered:'Lift Ordered', liftExpected:'Lift Expected', comment:'Comment', task:'Task name', phase:'Phase', owner:'Owner'};
function diffChanges(before, after, fields){
  const parts = [];
  fields.forEach(f=>{
    const a = before[f], b = after[f];
    const av = (a===undefined||a===null||a==='') ? '—' : String(a);
    const bv = (b===undefined||b===null||b==='') ? '—' : String(b);
    if(av!==bv) parts.push(`${EDIT_FIELD_LABELS[f]||f}: "${av}" → "${bv}"`);
  });
  return parts;
}

function openEditProjectModal(idx, allowDelete){

/* Fixed % widths per view so expanding an Actions row (which reveals wider task cells)
   can never resize the columns above/below it — table-layout:fixed only holds steady

const COL_WIDTHS = {
  overview: {'#':'40px','Client':'160px','Job Type':'100px','Quote# / Job#':'110px','Status':'110px','Current Stage':'190px','% Complete':'100px','Last touched':'130px','Comments':'160px','':'60px'},

function theadHtml(v){
  const keyMap = active==='overview' ? OVERVIEW_COL_KEYS : null;
  const state = overviewSort;
  const widths = COL_WIDTHS[active];
  return v.cols.map(c=>{

/* ---- Gantt: keep every bar's label in view ----
   When a bar starts left of the visible timeline (behind the sticky #/Type/Project columns, or
   scrolled out), its label would be cut off at the start ("…ing Drawings · 21 July"). This slides
   each label right so it starts at the first visible pixel of its bar, and never past the bar's
   own end. Runs on scroll, resize and whenever the Gantt is redrawn or a bar is dragged. */
let ganttPinQueued = false;
function pinGanttLabels(){
  ganttPinQueued = false;
  document.querySelectorAll('.gantt-scroll').forEach(sc=>{
    const scRect = sc.getBoundingClientRect();
    const stickyLabel = sc.querySelector('.gantt-row:not(.header-row) .gantt-label') || sc.querySelector('.gantt-label');
    const visibleLeft = stickyLabel ? stickyLabel.getBoundingClientRect().right : scRect.left;
    sc.querySelectorAll('.gantt-bar').forEach(bar=>{
      const label = bar.querySelector('.seg-label');
      if(!label) return;
      const br = bar.getBoundingClientRect();
      const room = Math.max(0, br.width - label.offsetWidth - 4);
      const offset = Math.min(Math.max(0, visibleLeft - br.left), room);
      const next = offset > 0.5 ? `translateX(${Math.round(offset)}px)` : '';
      if(label.style.transform !== next) label.style.transform = next;
    });
  });
}
function scheduleGanttPin(){
  if(ganttPinQueued) return;
  ganttPinQueued = true;
  requestAnimationFrame(pinGanttLabels);
}
document.addEventListener('scroll', e=>{
  if(e.target && e.target.classList && e.target.classList.contains('gantt-scroll')) scheduleGanttPin();
}, true);
window.addEventListener('resize', scheduleGanttPin);
(function watchGantt(){
  const card = document.getElementById('ganttCard');
  if(!card) return;
  new MutationObserver(muts=>{
    if(muts.some(m=>!(m.target.classList && m.target.classList.contains('seg-label')))) scheduleGanttPin();
  }).observe(card, {childList:true, subtree:true, attributes:true, attributeFilter:['style']});
})();

/* ---- Gantt (weekly) ---- */
function isoWeekNumber(dt){
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const dayNum = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-dayNum+3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(),0,4));
  const fDayNum = (firstThursday.getUTCDay()+6)%7;
  firstThursday.setUTCDate(firstThursday.getUTCDate()-fDayNum+3);
  return 1 + Math.round((d-firstThursday)/(7*86400000));
}
function mondayOf(dt){ const d=new Date(dt); const day=(d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d; }
function buildWeeks(){
  const weeks=[]; let cur=mondayOf(RANGE_START);
  while(cur < RANGE_END){
    weeks.push({date:new Date(cur), weekNo:isoWeekNumber(cur), month:cur.toLocaleDateString('en-AU',{month:'short'})});
    cur = new Date(cur); cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
const WEEKS = buildWeeks();
const TIMELINE_WIDTH = WEEKS.length*WEEK_WIDTH;
function xPos(dstr){ if(!dstr) return 0; const days=(new Date(dstr)-WEEKS[0].date)/86400000; return Math.max(0,(days/7)*WEEK_WIDTH); }
function monthBands(){
  const bands=[]; let i=0;
  while(i<WEEKS.length){
    let j=i; while(j<WEEKS.length && WEEKS[j].month===WEEKS[i].month) j++;
    bands.push({month:WEEKS[i].month, x:i*WEEK_WIDTH, width:(j-i)*WEEK_WIDTH});
    i=j;
  }
  return bands;
}

function ganttHeaderHtml(){
  let html = `<div class="gantt-row month-row header-row"><div class="gantt-num">#</div><div class="gantt-jobtype">Type</div><div class="gantt-label"><span class="gantt-label-title">Project</span><div class="gantt-resize-handle" title="Drag to resize this column"></div></div><div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;">`;
  html += monthBands().map(b=>`<div class="month-band" style="left:${b.x}px;width:${b.width}px;">${b.month}</div>`).join('');
  html += `</div></div>`;
  html += `<div class="gantt-row week-header-row header-row"><div class="gantt-num"></div><div class="gantt-jobtype"></div><div class="gantt-label"></div><div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;">`;
  html += WEEKS.map((w,i)=>`<div class="week-col" style="left:${i*WEEK_WIDTH}px;width:${WEEK_WIDTH}px;">Wk ${w.weekNo}</div>`).join('');
  html += `</div></div>`;
  return html;
}

const LINE_H = 36;

/* Every bar's own label always carries its date range (in a separate span the drag handler can
   live-update), so the date is never lost to truncation in the left column and always matches
   whatever the bar currently shows — including mid-drag, before the change is even committed. */
function barDateSpan(start, end){
  return `<span class="bar-date-text" data-datespan="1">${fmt(start)} → ${fmt(end)}</span>`;
}
function mainBarHtml(r, lineIdx){
  const top = lineIdx*LINE_H+4, h = LINE_H-8;
  const overallLeft = xPos(r.start), overallRight = xPos(r.end);
  const overallWidth = Math.max(overallRight-overallLeft, 10);
  if(r.liftOrdered && r.liftExpected){
    const waitLeft = xPos(r.liftOrdered), waitRight = xPos(r.liftExpected);
    const waitWidth = Math.max(waitRight-waitLeft,10);
    const activeLeft = waitRight, activeWidth = Math.max(overallRight-waitRight,10);
    const activeCls = barStatusClass(currentPhase(r) ? currentPhase(r).status : r.status, r.end);
    return `<div class="gantt-bar gantt-drag-bar seg-wait" data-idx="${r.idx}" data-start-field="liftOrdered" data-end-field="liftExpected" style="top:${top}px;height:${h}px;left:${waitLeft}px;width:${waitWidth}px;"><span class="seg-label">Procurement Lead Time · ${barDateSpan(r.liftOrdered, r.liftExpected)}</span></div>`
      + `<div class="gantt-bar gantt-drag-bar ${activeCls}" data-idx="${r.idx}" data-start-field="liftExpected" data-end-field="end" style="top:${top}px;height:${h}px;left:${activeLeft}px;width:${activeWidth}px;"><span class="seg-label">${r.stage} · ${barDateSpan(r.liftExpected, r.end)}</span></div>`;
  }
  /* Same status source as the Detailed phase bars (currentPhase), so Compact and Detailed can
     never show two different colours for the same phase — falls back to the project Status field
     only for the rare project with no phases[] recorded yet (now the exact same 4 values, so no
     remapping needed). Overdue (end date passed, not Completed) overrides the status colour with red. */
  const cur = currentPhase(r);
  const effStatus = cur ? cur.status : r.status;
  /* Overdue check uses r.end, not the phase's own end date — the bar itself is drawn to r.start/
     r.end (the project's overall span), so redness must follow whatever the bar visually covers. */
  const cls = barStatusClass(effStatus, r.end);
  /* Compact: the whole project span is drawn in a light tint, and only the current phase is
     drawn in full colour — so a project that has just moved into a new phase no longer looks as
     if that phase covers the whole bar. Falls back to the plain full-colour bar when there is no
     phase, or the current phase already spans the whole project. */
  const curLeft = cur && cur.start ? Math.max(xPos(cur.start), overallLeft) : overallLeft;
  const curRight = cur && cur.end ? Math.min(xPos(cur.end), overallRight) : overallRight;
  const showSplit = cur && (curLeft > overallLeft + 1 || curRight < overallRight - 1) && curRight > curLeft;
  if(showSplit){
    const segLeft = curLeft - overallLeft, segWidth = Math.max(curRight - curLeft, 6);
    return `<div class="gantt-bar gantt-drag-bar ${cls} span-light" data-idx="${r.idx}" data-start-field="start" data-end-field="end" style="top:${top}px;height:${h}px;left:${overallLeft}px;width:${overallWidth}px;" title="Project ${fmt(r.start)} → ${fmt(r.end)} · current phase ${fmt(cur.start)} → ${fmt(cur.end)}"><div class="cur-phase-seg ${cls}" style="left:${segLeft}px;width:${segWidth}px;"></div><span class="seg-label">${r.stage} · ${barDateSpan(r.start, r.end)}</span></div>`;
  }
  return `<div class="gantt-bar gantt-drag-bar ${cls}" data-idx="${r.idx}" data-start-field="start" data-end-field="end" style="top:${top}px;height:${h}px;left:${overallLeft}px;width:${overallWidth}px;"><span class="seg-label">${r.stage} · ${barDateSpan(r.start, r.end)}</span></div>`;
}
function phaseBarHtml(r, p, lineIdx){
  const top = lineIdx*LINE_H+4, h = LINE_H-8;
  const pLeft = xPos(p.start), pRight = xPos(p.end);
  const pWidth = Math.max(pRight-pLeft, 10);
  const cls = barStatusClass(p.status, p.end);
  const pidx = r.phases.indexOf(p);
  return `<div class="gantt-bar gantt-drag-bar gantt-phase-bar ${cls}" data-idx="${r.idx}" data-phase-idx="${pidx}" data-start-field="start" data-end-field="end" style="top:${top}px;height:${h}px;left:${pLeft}px;width:${pWidth}px;"><span class="seg-label">${p.name} · ${barDateSpan(p.start, p.end)}</span></div>`;
}
function taskBarHtml(t, lineIdx){
  /* Deliberately thinner than a phase bar — some linked tasks carry names like "Feasibility
     Assessment" or "Working Drawings" (imported from the old task list), which would otherwise
     look exactly like a phase bar and make it seem like Project Overview's phase list is missing
     entries. This bar is a task, never a phase, regardless of its name. */
  const h = LINE_H-18, top = lineIdx*LINE_H + (LINE_H-h)/2;
  const tLeft = xPos(t.start), tRight = xPos(t.end);
  const tWidth = Math.max(tRight-tLeft, 10);
  return `<div class="gantt-bar gantt-drag-bar gantt-task-bar ${barStatusClass(t.status, t.end)}" data-task-idx="${t.idx}" data-start-field="start" data-end-field="end" style="top:${top}px;height:${h}px;left:${tLeft}px;width:${tWidth}px;"><span class="seg-label">${t.task} — ${t.owner} · ${shortStage(t.phase)} · ${barDateSpan(t.start, t.end)}</span></div>`;
}

function ganttRowHtml(r, mode, num){
  const detailed = mode==='detailed';
  const myPhases = detailed ? [...(r.phases||[])].sort((a,b)=> phaseNum(a.name)-phaseNum(b.name)) : [];
  const myTasks = detailed ? tasks.filter(t=>!t.deleted && t.projectIdx===r.idx).sort((a,b)=> new Date(a.start||0)-new Date(b.start||0)) : [];
  const usingPhaseStack = detailed && myPhases.length>0;
  /* Phase and task bars stack directly from line 0 — no separate client-name-only header line
     above them. The client name instead rides on the first phase's own line (see phaseLabelLines
     below), so every line in the label column carries a bar next to it and no row height goes to
     waste. */
  const lineCount = usingPhaseStack ? (myPhases.length + myTasks.length) : (1 + (detailed?myTasks.length:0));
  const rowHeight = Math.max(lineCount,1)*LINE_H;

  let bars = '';
  if(usingPhaseStack){
    myPhases.forEach((p,i)=>{ bars += phaseBarHtml(r, p, i); });
    myTasks.forEach((t,i)=>{ bars += taskBarHtml(t, myPhases.length+i); });
  } else {
    bars += mainBarHtml(r, 0);
    if(detailed) myTasks.forEach((t,i)=>{ bars += taskBarHtml(t, 1+i); });
  }

  /* Dates are never repeated in this column — every bar already carries its own start/end via
     barDateSpan, so the label text only needs to say WHAT each line is (client, phase, task). */
  const phaseLabelLines = usingPhaseStack ? myPhases.map((p,i)=>`<div class="task-label-line" style="height:${LINE_H}px; display:flex; align-items:center;">
      ${i===0
        ? `<span class="client" style="font-size:13px;" title="${r.client}">${r.client}</span>`
        : `<span class="gantt-dates task-dates" title="${p.name}"><b>${p.name}</b></span>`}
    </div>`).join('') : '';
  const taskLabelLines = detailed ? myTasks.map(t=>`<div class="task-label-line" style="height:${LINE_H}px; display:flex; align-items:center;">
      <span class="gantt-dates task-dates" title="Task — ${t.task} (${shortStage(t.phase)}), owned by ${t.owner}"><b>${t.task} — ${t.owner} · ${shortStage(t.phase)}</b></span>
    </div>`).join('') : '';

  /* Subtle zebra shading per project (not per phase/task line within it) so one project's block
     is easy to tell apart from the next when rows stack up. */
  const rowBg = (num%2===0) ? '#FAFAF9' : '#FFFFFF';
  const headerLine = usingPhaseStack ? '' : `<div style="height:${LINE_H}px; display:flex; flex-direction:column; justify-content:center;">
        <div class="client">${r.client}</div>
      </div>`;
  return `<div class="gantt-row" style="height:${rowHeight}px; background:${rowBg};">
    <div class="gantt-num" style="height:${rowHeight}px; background:${rowBg};">${num}</div>
    <div class="gantt-jobtype" style="height:${rowHeight}px; background:${rowBg};" title="${r.type}">${r.type}</div>
    <div class="gantt-label" style="height:${rowHeight}px; background:${rowBg}; justify-content:${(phaseLabelLines||taskLabelLines)?'flex-start':'center'};">
      ${headerLine}
      ${phaseLabelLines}${taskLabelLines}
    </div>
    <div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;height:${rowHeight}px;">${bars}</div>
  </div>`;
}

function computeWeeklyLoad(){
  const activeRows = rows.filter(r=>!r.deleted && r.start && r.end);
  return WEEKS.map(w=>{
    const wStart = w.date.getTime();
    const wEnd = wStart + 7*86400000 - 1;
    return activeRows.filter(r=>{
      const s = new Date(r.start).getTime();
      const en = new Date(r.end).getTime();
      return s <= wEnd && en >= wStart;
    }).length;
  });
}
function workloadScale(loads){
  const maxLoad = Math.max(...loads, 1);
  const yMax = Math.max(maxLoad, 1);
  const chartH = 220, padTop = 14, padBottom = 10;
  const plotH = chartH - padTop - padBottom;
  const yFor = v => padTop + plotH - (v/yMax)*plotH;
  return { yMax, chartH, padTop, padBottom, plotH, yFor };
}
function workloadChartHtml(loads, scale){
  const { chartH, yFor, yMax } = scale;
  const cx = i => i*WEEK_WIDTH + WEEK_WIDTH/2;
  const points = loads.map((v,i)=>`${cx(i)},${yFor(v).toFixed(1)}`).join(' ');
  const areaPoints = `${cx(0)},${yFor(0).toFixed(1)} ${points} ${cx(loads.length-1)},${yFor(0).toFixed(1)}`;
  let grid = '';
  for(let v=0; v<=yMax; v++){
    const y = yFor(v).toFixed(1);
    grid += `<line x1="0" y1="${y}" x2="${TIMELINE_WIDTH}" y2="${y}" stroke="var(--border)" stroke-width="1"/>`;
  }
  const dots = loads.map((v,i)=>`<circle cx="${cx(i)}" cy="${yFor(v).toFixed(1)}" r="2.6" fill="var(--sp-blue)"><title>Wk ${WEEKS[i].weekNo}: ${v} active project${v===1?'':'s'}</title></circle>`).join('');
  const todayX = xPos(todayStr());
  return `<div class="workload-chart-wrap">
    <svg width="${TIMELINE_WIDTH}" height="${chartH}" style="display:block;">
      ${grid}
      <polygon points="${areaPoints}" fill="rgba(0,120,212,0.08)"/>
      <polyline points="${points}" fill="none" stroke="var(--sp-blue)" stroke-width="2"/>
      ${dots}
      <line x1="${todayX}" y1="0" x2="${todayX}" y2="${chartH}" stroke="#D13438" stroke-width="1.5" stroke-dasharray="4,3"/>
    </svg>
  </div>`;
}
function workloadAxisHtml(scale){
  const { yMax, yFor } = scale;
  let labels = '';
  for(let v=0; v<=yMax; v++){
    const y = yFor(v);
    labels += `<div style="position:absolute; left:0; right:6px; top:${(y-7).toFixed(1)}px; text-align:right; font-size:10px; color:var(--text-muted);">${v}</div>`;
  }
  return `<div style="position:relative; height:100%; width:100%;">${labels}</div>`;
}

function ganttHtml(){
  const todayX = xPos(todayStr());
  if(ganttMode==='workload'){
    const WLW = 96;
    const labelStyle = `flex:0 0 ${WLW}px; width:${WLW}px; left:0;`;
    let html = `<div class="gantt-legend">
      <div class="legend-item"><span class="swatch" style="background:var(--sp-blue)"></span>Active projects running that week (by start–end dates)</div>
      <div class="legend-item"><span style="border-left:2px dashed #D13438;height:10px;display:inline-block;"></span>Today</div>
    </div>`;
    html += `<div class="gantt-scroll"><div class="gantt-scroll-content" style="width:${WLW+TIMELINE_WIDTH}px;">`;
    html += `<div class="gantt-row month-row header-row"><div class="gantt-label" style="${labelStyle}font-weight:600;font-size:12px;color:var(--text-muted);">Workload</div><div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;">`
      + monthBands().map(b=>`<div class="month-band" style="left:${b.x}px;width:${b.width}px;">${b.month}</div>`).join('') + `</div></div>`;
    html += `<div class="gantt-row week-header-row header-row"><div class="gantt-label" style="${labelStyle}"></div><div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;">`
      + WEEKS.map((w,i)=>`<div class="week-col" style="left:${i*WEEK_WIDTH}px;width:${WEEK_WIDTH}px;">Wk ${w.weekNo}</div>`).join('') + `</div></div>`;
    const workloadLoads = computeWeeklyLoad();
    const workloadScaleVal = workloadScale(workloadLoads);
    html += `<div class="gantt-row" style="height:220px;">
      <div class="gantt-label" style="${labelStyle}align-items:stretch; padding:8px 0 8px 10px;">
        <div class="muted" style="font-size:10.5px; margin-bottom:4px; line-height:1.3;">Active projects</div>
        <div style="flex:1; position:relative; min-height:0;">${workloadAxisHtml(workloadScaleVal)}</div>
      </div>
      <div class="gantt-timeline" style="width:${TIMELINE_WIDTH}px;height:220px;">${workloadChartHtml(workloadLoads, workloadScaleVal)}</div>
    </div>`;
    html += `<div class="today-line" style="left:${WLW+todayX}px;"></div><div class="today-tag" style="left:${WLW+todayX}px;">Today</div>`;
    html += `</div></div>`;
    return html;
  }
  let html = `<div class="gantt-legend">
    <div class="legend-item"><span class="swatch" style="background:var(--sp-blue)"></span>In Progress</div>
    <div class="legend-item"><span class="swatch" style="background:#FFB900"></span>Pending</div>
    <div class="legend-item"><span class="swatch seg-hold" style="width:14px;height:9px;"></span>Standby/On Hold</div>
    <div class="legend-item"><span class="swatch" style="background:#5EA35E"></span>Completed</div>
    <div class="legend-item"><span class="swatch seg-wait" style="width:14px;height:9px;"></span>Procurement Lead Time</div>
    <div class="legend-item"><span class="swatch" style="background:#D13438"></span>Overdue (end date passed, not Completed)</div>
    <div class="legend-item"><span style="border-left:2px dashed #D13438;height:10px;display:inline-block;"></span>Today</div>
  </div>`;
  html += `<div class="gantt-scroll"><div class="gantt-scroll-content" style="width:${30+84+220+TIMELINE_WIDTH}px;">`;
  html += ganttHeaderHtml();
  const orderedGroups = orderProjects(rows.filter(r=>!r.deleted));
  let gn = 1;
  orderedGroups.forEach(g=> g.rows.forEach(r=>{ html += ganttRowHtml(r, ganttMode, gn++); }));
  html += `<div class="today-line" style="left:${30+84+220+todayX}px;"></div><div class="today-tag" style="left:${30+84+220+todayX}px;">Today</div>`;
  html += `</div></div>`;
  return html;
}

let active = 'overview';
let addingNew = false;
let ganttMode = 'compact';
let ganttLabelWidth = 220;
const PCT_STEPS = [0,25,50,75,100];
function nearestStep(val){ return PCT_STEPS.reduce((a,b)=>Math.abs(b-val)<Math.abs(a-val)?b:a); }

function render(){
  editingField = false;
  const syncStatus = document.getElementById('syncStatus');
  if(syncStatus) updateSyncStatus();
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = Object.entries(views).map(([key,v])=>
    `<div class="tab ${key===active?'active':''}" data-key="${key}">${v.label}<span class="count">${computeCount(key)}</span></div>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{active=el.dataset.key; addingNew=false; expandedActionsProject=new Set(); addingTaskFor=null; openDropdown=null; render();}));

  const v = views[active];
  document.getElementById('viewDesc').innerHTML = v.desc + (v.hint ? ` <span class="hint">${v.hint}</span>` : '');

  const insightBox = document.getElementById('insightBox');
  if(active==='actions'){
    const stale = rows.filter(r=>!r.deleted && daysAgo(r.modified)>=7 && r.status!=='Completed');
    if(stale.length){
      insightBox.innerHTML = `Needs input to stay current: <b>${stale.length}</b> project${stale.length>1?'s':''} not touched in 7+ days. A quick Stage, % Complete or Comment update resets the clock.`;
    } else {
      insightBox.innerHTML = `Nothing overdue — every active job has been touched in the last 7 days.`;
    }
    insightBox.style.display = 'block';
  } else {
    insightBox.style.display = 'none';
  }

  if(v.isGantt){
    document.getElementById('tableCard').style.display='none';
    const gc = document.getElementById('ganttCard');
    const prevScroll = gc.querySelector('.gantt-scroll');
    const scrollLeft = prevScroll ? prevScroll.scrollLeft : null;
    gc.style.display='block';
    gc.style.setProperty('--gantt-label-w', ganttLabelWidth+'px');
    gc.innerHTML = ganttHtml();
    if(scrollLeft !== null){
      const newScroll = gc.querySelector('.gantt-scroll');
      if(newScroll) newScroll.scrollLeft = scrollLeft;
    }
    const resizeHandle = gc.querySelector('.gantt-resize-handle');
    if(resizeHandle) resizeHandle.addEventListener('mousedown', (e)=>{
      e.preventDefault();
      const startX = e.clientX, startW = ganttLabelWidth;
      resizeHandle.classList.add('dragging');
      function onMove(ev){
        ganttLabelWidth = Math.max(120, Math.min(420, startW + (ev.clientX - startX)));
        gc.style.setProperty('--gantt-label-w', ganttLabelWidth+'px');
      }
      function onUp(){
        resizeHandle.classList.remove('dragging');
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    document.getElementById('foot').innerHTML = ganttMode==='workload'
      ? `<b>Note:</b> counts how many projects are running at once each week, based on their start/end dates — use it to see busy periods before committing to a new job. Switch back to Compact or Detailed to edit dates and status.`
      : `<b>Note:</b> columns are calendar weeks — scroll right for later dates. Same project order as Project Overview. Detailed mode shows each project's phase history stacked chronologically, oldest on top.`;
  } else {
    document.getElementById('ganttCard').style.display='none';
    document.getElementById('tableCard').style.display='block';
    document.getElementById('theadRow').innerHTML = theadHtml(v);
    document.getElementById('tbody').innerHTML =
      (active==='overview' && addingNew ? newRowFormHtml() : '') +
      v.build().join('');
    document.querySelectorAll('.sortable-th').forEach(th=>th.addEventListener('click', ()=>{
      const key = th.dataset.sortKey;
      if(overviewSort.col===key) overviewSort.dir = overviewSort.dir==='asc' ? 'desc' : 'asc';
      else { overviewSort.col = key; overviewSort.dir = 'asc'; }
      render();
    }));
    document.getElementById('foot').innerHTML = active==='actions'
      ? `<b>Note:</b> items are grouped under their project, in the same order as Project Overview — expand a project's ▸ to see them and add a new task.`
      : `<b>Note:</b> "Last touched" updates automatically whenever a row is edited.`;

    if(active==='overview' && addingNew){
      document.getElementById('nrSave').addEventListener('click', saveNewRow);
      document.getElementById('nrCancel').addEventListener('click', ()=>{ addingNew=false; render(); });
      document.getElementById('nrClient').focus();
    }
    if(active==='overview'){
      document.querySelectorAll('.phase-toggle-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        const idx = parseInt(b.dataset.idx,10);
        if(expandedOverview.has(idx)) expandedOverview.delete(idx); else expandedOverview.add(idx);
        render();
      }));
      document.querySelectorAll('.edit-row-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        openEditProjectModal(parseInt(b.dataset.idx,10));
      }));
      /* Guard the "+ Add phase" mini-form the same way as every other inline editor: while any of
         its fields has focus, the background sync must not rebuild the table underneath it — that
         is exactly what made half-filled phase edits vanish if the PM wasn't fast enough. */
      document.querySelectorAll('.phase-add-row select, .phase-add-row input').forEach(el=>{
        el.addEventListener('focus', ()=>{ editingField = true; });
        el.addEventListener('input', ()=>{ editingField = true; });
        el.addEventListener('change', ()=>{ editingField = true; });
      });
      document.querySelectorAll('.phase-add-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        const idx = parseInt(b.dataset.idx,10);
        const row = rows[idx];
        const nameSel = document.querySelector(`.phase-add-name[data-idx="${idx}"]`);
        const startInp = document.querySelector(`.phase-add-start[data-idx="${idx}"]`);
        const endInp = document.querySelector(`.phase-add-end[data-idx="${idx}"]`);
        const statusSel = document.querySelector(`.phase-add-status[data-idx="${idx}"]`);
        if(!nameSel) return;
        const phase = { name:nameSel.value, start:startInp.value||todayStr(), end:endInp.value||addDays(startInp.value||todayStr(),30), status:statusSel.value };
        row.phases = row.phases || [];
        row.phases.push(phase);
        if(phase.status==='In Progress'){ row.stage = phase.name; row.modified = todayStr(); }
        persistProject(idx, {phases: row.phases, stage: row.stage});
        notify(row, `<b>${row.client}</b> — added ${phase.name} (${phase.status}, ${fmt(phase.start)} → ${fmt(phase.end)}).`);
        render();
      }));
      document.querySelectorAll('.phase-remove-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        const idx = parseInt(b.dataset.idx,10);
        const pidx = parseInt(b.dataset.pidx,10);
        const row = rows[idx];
        const removed = row.phases.splice(pidx,1)[0];
        persistProject(idx, {phases: row.phases});
        notify(row, `Removed <b>${removed.name}</b> from <b>${row.client}</b>.`);
        render();
      }));
    }
    if(active==='actions'){
      document.querySelectorAll('.action-expand-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        const idx = parseInt(b.dataset.idx,10);
        if(expandedActionsProject.has(idx)){ expandedActionsProject.delete(idx); if(addingTaskFor===idx) addingTaskFor=null; }
        else expandedActionsProject.add(idx);
        render();
      }));
      document.querySelectorAll('.add-task-trigger-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        addingTaskFor = parseInt(b.dataset.idx,10);
        render();
      }));
      document.querySelectorAll('.edit-task-btn').forEach(b=>b.addEventListener('click', (e)=>{ e.stopPropagation();
        openEditTaskModal(parseInt(b.dataset.idx,10));
      }));
      document.querySelectorAll('tr.new-row[data-project-idx]').forEach(trEl=>{
        const pIdx = parseInt(trEl.dataset.projectIdx,10);
        trEl.querySelector('#ntSave').addEventListener('click', ()=>saveNewTask(pIdx));
        trEl.querySelector('#ntCancel').addEventListener('click', ()=>{ addingTaskFor=null; render(); });
        trEl.querySelector('#ntOwner').addEventListener('change', ()=>{
          const isAdd = trEl.querySelector('#ntOwner').value==='__add__';
          const ntOwnerNew = trEl.querySelector('#ntOwnerNew');
          ntOwnerNew.style.display = isAdd ? 'block' : 'none';
          if(isAdd) ntOwnerNew.focus();
        });
        trEl.querySelector('#ntStatus').addEventListener('change', ()=>{
          trEl.querySelector('#ntPct').value = statusDefaultPct(trEl.querySelector('#ntStatus').value);
        });
        trEl.querySelector('#ntTask').focus();
      });
    }
  }

  const toolbar = document.getElementById('toolbar');
  let rightHtml = '';
  if(active==='overview' && !addingNew) rightHtml = `<button id="addNewBtn" class="btn-primary">+ New</button>`;
  else if(active==='actions'){
    const idxs = actionsProjectIdxs();
    const allOpen = idxs.length>0 && idxs.every(idx=>expandedActionsProject.has(idx));
    rightHtml = `<button id="expandAllBtn" class="btn-secondary">${allOpen ? 'Collapse all' : 'Expand all'}</button>`;
  }
  else if(active==='gantt') rightHtml = `<div class="seg-toggle">
      <button class="seg-btn ${ganttMode==='compact'?'active':''}" data-mode="compact">Compact</button>
      <button class="seg-btn ${ganttMode==='detailed'?'active':''}" data-mode="detailed">Detailed</button>
      <button class="seg-btn ${ganttMode==='workload'?'active':''}" data-mode="workload">Workload</button>
    </div>`;
  toolbar.innerHTML = `<div class="toolbar-left">${toolbarFilterSortHtml()}</div><div class="toolbar-right">${rightHtml}</div>`;

  if(active==='overview' && !addingNew) document.getElementById('addNewBtn').addEventListener('click', ()=>{ addingNew=true; render(); });
  else if(active==='actions') document.getElementById('expandAllBtn').addEventListener('click', ()=>{
    const idxs = actionsProjectIdxs();
    const allOpen = idxs.length>0 && idxs.every(idx=>expandedActionsProject.has(idx));
    expandedActionsProject = allOpen ? new Set() : new Set(idxs);
    if(allOpen) addingTaskFor = null;
    render();
  });
  else if(active==='gantt') toolbar.querySelectorAll('.seg-btn').forEach(b=>b.addEventListener('click', ()=>{ ganttMode=b.dataset.mode; render(); }));

  if(active==='overview' || active==='actions') wireFilterSortEvents();
}

function stageOptionsFor(){ return PHASE_NAMES; }

function handleGridClick(e){
  const pctWrap = e.target.closest('.editable-pct');
  if(pctWrap){
    if(pctWrap.querySelector('select')) return;
    const kind = pctWrap.dataset.kind || 'project';
    const idx = pctWrap.dataset.idx;
    const target = kind==='task' ? tasks[idx] : rows[idx];
    const label = kind==='task' ? `${target.owner}: ${target.task}` : target.client;
    const current = nearestStep(target.pct);
    pctWrap.innerHTML = `<select class="pct-input">${PCT_STEPS.map(v=>`<option value="${v}" ${v===current?'selected':''}>${v}%</option>`).join('')}</select>`;
    const sel = pctWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      target.pct = v;
      if(kind==='project'){ target.modified = todayStr(); persistProject(idx, {pct:v, modified:target.modified}); }
      else persistTask(idx, {pct:v});
      notify(target, `<b>${label}</b> saved at ${v}%.`);
      render();
    }
    sel.addEventListener('change', ()=>commit(parseInt(sel.value,10)));
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const ownerWrap = e.target.closest('.editable-owner');
  if(ownerWrap){
    if(ownerWrap.querySelector('select') || ownerWrap.querySelector('input')) return;
    const idx = ownerWrap.dataset.idx;
    const target = tasks[idx];
    const label = `${target.task} (${target.client})`;
    const opts = OWNERS.map(o=>`<option value="${o}" ${o===target.owner?'selected':''}>${o}</option>`).join('') + `<option value="__add__">+ Add new owner…</option>`;
    ownerWrap.innerHTML = `<select class="stage-input owner-select">${opts}</select>`;
    const sel = ownerWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function finish(name){
      committed = true;
      target.owner = name;
      persistTask(idx, {owner:name});
      notify(target, `<b>${label}</b> — owner set to ${name}.`);
      render();
    }
    sel.addEventListener('change', ()=>{
      if(sel.value==='__add__'){
        committed = true;
        ownerWrap.innerHTML = `<input type="text" class="date-input owner-new-input" placeholder="New owner name">`;
        const inp = ownerWrap.querySelector('input');
        inp.focus();
        editingField = true;
        inp.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); } });
        inp.addEventListener('blur', ()=>{
          const name = inp.value.trim();
          if(name){ addOwner(name); finish(name); } else { render(); }
        });
      } else {
        finish(sel.value);
      }
    });
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const phaseStatusWrap = e.target.closest('.editable-phase-status');
  if(phaseStatusWrap){
    if(phaseStatusWrap.querySelector('select')) return;
    const idx = phaseStatusWrap.dataset.idx;
    const pidx = phaseStatusWrap.dataset.pidx;
    const row = rows[idx];
    const phase = row.phases[pidx];
    const opts = phaseStatusOptions().map(s=>`<option value="${s}" ${s===phase.status?'selected':''}>${statusLabel(s)}</option>`).join('');
    phaseStatusWrap.outerHTML = `<span class="editable-phase-status" data-idx="${idx}" data-pidx="${pidx}"><select class="stage-input">${opts}</select></span>`;
    const newWrap = document.querySelector(`.editable-phase-status[data-idx="${idx}"][data-pidx="${pidx}"]`);
    const sel = newWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      phase.status = v;
      if(v==='In Progress'){ row.stage = phase.name; row.modified = todayStr(); }
      persistProject(idx, {phases: row.phases, stage: row.stage});
      notify(row, `<b>${row.client}</b> — ${phase.name} set to ${v}.`);
      render();
    }
    sel.addEventListener('change', ()=>commit(sel.value));
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const phaseDateWrap = e.target.closest('.editable-phase-date');
  if(phaseDateWrap){
    if(phaseDateWrap.querySelector('input')) return;
    const idx = phaseDateWrap.dataset.idx;
    const pidx = phaseDateWrap.dataset.pidx;
    const field = phaseDateWrap.dataset.field;
    const row = rows[idx];
    const phase = row.phases[pidx];
    const html = `<span class="editable-phase-date" data-idx="${idx}" data-pidx="${pidx}" data-field="${field}"><input type="date" class="date-input" value="${phase[field]||''}"></span>`;
    phaseDateWrap.outerHTML = html;
    const newWrap = e.currentTarget.querySelector(`.editable-phase-date[data-idx="${idx}"][data-pidx="${pidx}"][data-field="${field}"]`);
    const inp = newWrap.querySelector('input');
    inp.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      phase[field] = v || null;
      persistProject(idx, {phases: row.phases});
      notify(row, `<b>${row.client}</b> — ${phase.name} ${field==='start'?'start date':'end date'} set to ${fmt(phase[field])}.`);
      render();
    }
    inp.addEventListener('change', ()=>commit(inp.value));
    inp.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const stageWrap = e.target.closest('.editable-stage');
  if(stageWrap){
    if(stageWrap.querySelector('select')) return;
    const idx = stageWrap.dataset.idx;
    const row = rows[idx];
    const opts = PHASE_NAMES;
    stageWrap.outerHTML = `<span class="editable-stage" data-idx="${idx}"><select class="stage-input">${opts.map(o=>`<option value="${o}" ${o===row.stage?'selected':''}>${o}</option>`).join('')}</select></span>`;
    const newWrap = document.querySelector(`.editable-stage[data-idx="${idx}"]`);
    const sel = newWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      const from = row.stage;
      row.stage = v;
      row.modified = todayStr();
      persistProject(idx, {stage:v, modified:row.modified});
      notify(row, from===v ? `No change — <b>${row.client}</b> stays at ${v}.` : `<b>${row.client}</b> moved from <b>${from}</b> to <b>${v}</b>.`);
      render();
    }
    sel.addEventListener('change', ()=>commit(sel.value));
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const statusWrap = e.target.closest('.editable-status');
  if(statusWrap){
    if(statusWrap.querySelector('select')) return;
    const idx = statusWrap.dataset.idx;
    const row = rows[idx];
    const opts = STATUS_OPTIONS.map(o=>`<option value="${o}" ${o===row.status?'selected':''}>${statusLabel(o)}</option>`).join('')
      + (active==='overview' ? `<option value="__delete__">🗑 Delete this project…</option>` : '');
    statusWrap.outerHTML = `<span class="editable-status" data-idx="${idx}"><select class="stage-input">${opts}</select></span>`;
    const newWrap = document.querySelector(`.editable-status[data-idx="${idx}"]`);
    const sel = newWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      const from = row.status;
      row.status = v;
      row.modified = todayStr();
      persistProject(idx, {status:v, modified:row.modified});
      notify(row, from===v ? `No change — <b>${row.client}</b> stays ${v}.` : `<b>${row.client}</b> status changed from <b>${from}</b> to <b>${v}</b>.`);
      render();
    }
    sel.addEventListener('change', ()=>{
      if(sel.value==='__delete__'){
        committed = true;
        showConfirmModal({
          title: 'Delete this project?',
          message: `Delete the project for <b>${row.client}</b>? This also removes its linked tasks from Actions and the Programme. This cannot be undone here.`,
          confirmLabel: 'Delete project',
          onConfirm: ()=> deleteProject(idx),
          onCancel: ()=> render()
        });
      } else {
        commit(sel.value);
      }
    });
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const taskWrap = e.target.closest('.editable-task-status');
  if(taskWrap){
    if(taskWrap.querySelector('select')) return;
    const idx = taskWrap.dataset.idx;
    const t = tasks[idx];
    const taskOpts = TASK_STATUSES.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${statusLabel(s)}</option>`).join('')
      + `<option value="__delete__">🗑 Delete this task…</option>`;
    taskWrap.innerHTML = `<select class="stage-input">${taskOpts}</select>`;
    const sel = taskWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      t.status = v;
      t.pct = statusDefaultPct(v);
      persistTask(idx, {status:v, pct:t.pct});
      notify(t, `<b>${t.owner}</b>: ${t.task} on <b>${t.client}</b> set to ${v}.`);
      render();
    }
    sel.addEventListener('change', ()=>{
      if(sel.value==='__delete__'){
        committed = true;
        showConfirmModal({
          title: 'Delete this task?',
          message: `Delete <b>${t.task}</b> for <b>${t.client}</b> (owned by ${t.owner})? This also removes it from the Programme. This cannot be undone here.`,
          confirmLabel: 'Delete task',
          onConfirm: ()=> deleteTask(idx),
          onCancel: ()=> render()
        });
      } else {
        commit(sel.value);
      }
    });
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const typeWrap = e.target.closest('.editable-type');
  if(typeWrap){
    if(typeWrap.querySelector('select')) return;
    const idx = typeWrap.dataset.idx;
    const row = rows[idx];
    const TYPE_OPTIONS = ['Extension','Lift Shaft','Renovation'];
    const opts = TYPE_OPTIONS.map(o=>`<option value="${o}" ${o===row.type?'selected':''}>${o}</option>`).join('');
    typeWrap.outerHTML = `<span class="editable-type" data-idx="${idx}"><select class="stage-input">${opts}</select></span>`;
    const newWrap = document.querySelector(`.editable-type[data-idx="${idx}"]`);
    const sel = newWrap.querySelector('select');
    sel.focus();
    editingField = true;
    let committed = false;
    function commit(v){
      committed = true;
      const from = row.type;
      row.type = v;
      row.modified = todayStr();
      persistProject(idx, {type:v, modified:row.modified});
      notify(row, from===v ? `No change — <b>${row.client}</b> stays ${v}.` : `<b>${row.client}</b> job type changed from <b>${from}</b> to <b>${v}</b>.`);
      render();
    }
    sel.addEventListener('change', ()=>commit(sel.value));
    sel.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const textWrap = e.target.closest('.editable-text');
  if(textWrap){
    if(textWrap.querySelector('input')) return;
    const idx = textWrap.dataset.idx;
    const field = textWrap.dataset.field;
    const placeholder = textWrap.dataset.placeholder || '';
    const row = rows[idx];
    const currentVal = (row[field] === '—' ? '' : (row[field] || ''));
    const html = `<span class="editable-text" data-idx="${idx}" data-field="${field}" data-placeholder="${placeholder.replace(/"/g,'&quot;')}"><input type="text" class="text-input" value="${currentVal.replace(/"/g,'&quot;')}" placeholder="${placeholder.replace(/"/g,'&quot;')}"></span>`;
    textWrap.outerHTML = html;
    const newWrap = e.currentTarget.querySelector(`.editable-text[data-idx="${idx}"][data-field="${field}"]`);
    const inp = newWrap.querySelector('input');
    inp.focus();
    inp.select();
    editingField = true;
    let committed = false;
    const fieldLabel = {client:'client name', quote:'quote number', job:'job number'}[field] || field;
    function commit(v){
      const val = v.trim();
      if(field==='client' && !val){
        showToast('Client name can\'t be blank — change was not saved.');
        render();
        return;
      }
      committed = true;
      row[field] = val || ((field==='quote' || field==='job') ? '—' : val);
      row.modified = todayStr();
      persistProject(idx, {[field]: row[field], modified: row.modified});
      notify(row, `<b>${row.client}</b> — ${fieldLabel} updated.`);
      render();
    }
    inp.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ ev.preventDefault(); inp.blur(); }
      if(ev.key==='Escape'){ committed = true; render(); }
    });
    inp.addEventListener('blur', ()=>{ if(!committed) commit(inp.value); });
    return;
  }

  const dateWrap = e.target.closest('.editable-date');
  if(dateWrap){
    if(dateWrap.querySelector('input')) return;
    const kind = dateWrap.dataset.kind || 'project';
    const idx = dateWrap.dataset.idx;
    const field = dateWrap.dataset.field;
    const target = kind==='task' ? tasks[idx] : rows[idx];
    const html = `<span class="editable-date" data-kind="${kind}" data-idx="${idx}" data-field="${field}"><input type="date" class="date-input" value="${target[field]||''}"></span>`;
    dateWrap.outerHTML = html;
    const newWrap = e.currentTarget.querySelector(`.editable-date[data-kind="${kind}"][data-idx="${idx}"][data-field="${field}"]`);
    const inp = newWrap.querySelector('input');
    inp.focus();
    editingField = true;
    let committed = false;
    const fieldLabel = {start:'start date', end:'end date', liftOrdered:'lift ordered', liftExpected:'expected delivery'}[field] || field;
    const label = kind==='task' ? `${target.task} (${target.client})` : target.client;
    function commit(v){
      committed = true;
      target[field] = v || null;
      if(kind==='project'){ target.modified = todayStr(); persistProject(idx, {[field]: target[field], modified: target.modified}); }
      else persistTask(idx, {[field]: target[field]});
      notify(target, `<b>${label}</b> — ${fieldLabel} set to ${fmt(target[field])}.`);
      render();
    }
    inp.addEventListener('change', ()=>commit(inp.value));
    inp.addEventListener('blur', ()=>{ if(!committed) render(); });
    return;
  }

  const whatWrap = e.target.closest('.editable-what');
  if(whatWrap){
    if(whatWrap.querySelector('input')) return;
    const idx = whatWrap.dataset.idx;
    const target = tasks[idx];
    const currentVal = (target.whatOverride!=null && target.whatOverride!=='') ? target.whatOverride : `${target.task} — ${shortStage(target.phase)}`;
    whatWrap.outerHTML = `<span class="editable-what" data-idx="${idx}"><input type="text" class="text-input" value="${currentVal.replace(/"/g,'&quot;')}" placeholder="What needs to happen"></span>`;
    const newWhatWrap = e.currentTarget.querySelector(`.editable-what[data-idx="${idx}"]`);
    const whatInp = newWhatWrap.querySelector('input');
    whatInp.focus();
    whatInp.select();
    editingField = true;
    let whatCommitted = false;
    function commitWhat(v){
      const val = v.trim();
      if(!val){
        showToast('What can\'t be blank — change was not saved.');
        render();
        return;
      }
      whatCommitted = true;
      target.whatOverride = val;
      persistTask(idx, {whatOverride: val});
      notify(target, `<b>${target.client}</b> — task updated.`);
      render();
    }
    whatInp.addEventListener('keydown', (ev)=>{
      if(ev.key==='Enter'){ ev.preventDefault(); whatInp.blur(); }
      if(ev.key==='Escape'){ whatCommitted = true; render(); }
    });
    whatInp.addEventListener('blur', ()=>{ if(!whatCommitted) commitWhat(whatInp.value); });
    return;
  }

  const commentWrap = e.target.closest('.editable-comment');
  if(commentWrap){
    if(commentWrap.parentElement.querySelector('textarea')) return;
    const kind = commentWrap.dataset.kind || 'project';
    const idx = commentWrap.dataset.idx;
    const target = kind==='task' ? tasks[idx] : rows[idx];
    commentWrap.outerHTML = `<textarea class="comment-input" data-kind="${kind}" data-idx="${idx}">${target.comment||''}</textarea>`;
    const ta = e.currentTarget.querySelector(`textarea.comment-input[data-kind="${kind}"][data-idx="${idx}"]`);
    ta.focus();
    editingField = true;
    let committed = false;
    const label = kind==='task' ? `${target.task} (${target.client})` : target.client;
    function commit(){
      committed = true;
      target.comment = ta.value.trim();
      if(kind==='project'){ target.modified = todayStr(); persistProject(idx, {comment: target.comment, modified: target.modified}); }
      else persistTask(idx, {comment: target.comment});
      notify(target, `<b>${label}</b> — comment updated.`);
      render();
    }
    ta.addEventListener('blur', commit);
    ta.addEventListener('keydown', (ev)=>{ if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); ta.blur(); } });
  }
}

document.getElementById('tbody').addEventListener('click', handleGridClick);
document.getElementById('ganttCard').addEventListener('click', handleGridClick);

  barEl.innerHTML = `<select class="gantt-status-select">${STATUS_OPTIONS.map(s=>`<option value="${s}" ${s===row.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>`;
  const sel = barEl.querySelector('select');
  sel.focus();
  editingField = true;
  let committed = false;
  function commit(v){
    committed = true;
    row.status = v;
    row.modified = todayStr();
    persistProject(idx, {status:v, modified:row.modified});
    notify(row, `<b>${row.client}</b> — status set to ${v}.`);
    render();
  }
  sel.addEventListener('change', ()=>commit(sel.value));
  sel.addEventListener('blur', ()=>{ if(!committed) render(); });
}

  const t = tasks[tIdx];
  barEl.innerHTML = `<select class="gantt-status-select">${TASK_STATUSES.map(s=>`<option value="${s}" ${s===t.status?'selected':''}>${statusLabel(s)}</option>`).join('')}</select>`;
  const sel = barEl.querySelector('select');
  sel.focus();
  editingField = true;
  let committed = false;
